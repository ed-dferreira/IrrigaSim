# ============================================================
# BUILD - IrrigaSim
# ============================================================
#
# COMO FUNCIONA:
# Este workflow é executado quando:
# - Uma nova tag é criada (ex: v1.0.0, v2.1.3)
#
# O que ele faz:
# 1. Compila o app Android (APK)
# 2. Compila o app Android (AAB - para Play Store)
# 3. Compila o app iOS e empacota o bundle em ZIP
# 4. Cria um Release no GitHub com os arquivos compilados
#
# Para criar um release:
#   git tag v1.0.0
#   git push origin v1.0.0
#
# Os artefatos ficam disponíveis na página de Releases do GitHub.
# ============================================================

name: Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/iphoneos/Runner.app.zip

      - name: Upload iOS build
        uses: actions/upload-artifact@v4
        with:
          name: ios-release.zip
          path: build/ios/iphoneos/Runner.app.zip

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release.apk

      - name: Download AAB
        uses: actions/download-artifact@v4
        with:
          name: app-release.aab

      - name: Download iOS
        uses: actions/download-artifact@v4
        with:
          name: ios-release.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app-release.apk
            app-release.aab
            Runner.app.zip
          generate_release_notes: true
